
name: Build APK

on:
  push:
    branches: [eoleun]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Download Gradle directly with retry.
      # Avoid setup-gradle provisioning timeout (HTTP 504).
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_HOME="$HOME/gradle"
          mkdir -p "$GRADLE_HOME"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$GRADLE_HOME/gradle-8.9-bin.zip"

          unzip -q "$GRADLE_HOME/gradle-8.9-bin.zip" \
            -d "$GRADLE_HOME"

          echo "$GRADLE_HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

          "$GRADLE_HOME/gradle-8.9/bin/gradle" --version

      # Preserve Gradle build caching
      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # Original SHA256 security verification
      - name: Guard - bundled ic98260 must match the hash pinned in the app
        shell: bash
        run: |
          set -euo pipefail

          ASSET="app/app/src/main/assets/ic98260"
          SOURCE="app/app/src/main/java/com/pd2405/ic/MainActivity.kt"

          if [ ! -f "$ASSET" ]; then
            echo "::error::Bundled ic98260 asset not found"
            exit 1
          fi

          PIN=$(grep -oP 'EXPECTED_SHA\s*=\s*"\K[0-9a-f]{64}' "$SOURCE" || true)
          GOT=$(sha256sum "$ASSET" | cut -d' ' -f1)

          echo "pinned in app : $PIN"
          echo "bundled asset : $GOT"

          if [ -z "$PIN" ]; then
            echo "::error::Could not read EXPECTED_SHA from MainActivity.kt"
            exit 1
          fi

          if [ "$PIN" != "$GOT" ]; then
            echo "::error::SHA256 mismatch - bundled ic98260 does not match app pin"
            exit 1
          fi

          echo "SHA256 verification passed"

      # Original APK build
      - name: Build debug APK
        run: gradle -p app assembleDebug --no-daemon --stacktrace

      # Collect APK
      - name: Collect APK with a predictable name
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          APK=$(find app/app/build/outputs/apk/debug \
            -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Debug APK not found"
            exit 1
          fi

          cp "$APK" "out/ic98260-app-${GITHUB_SHA:0:7}-debug.apk"

          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      # Upload every successful build
      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: ic98260-app-${{ github.sha }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      # GitHub Release only on version tag
      - name: Release (only on tag push, e.g. v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
